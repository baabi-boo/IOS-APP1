name: iOS build & screenshots

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label"
        required: false
        default: "macos-15-intel"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    # Intel runners render the simulator on the CPU; a full run usually takes 30–40 minutes
    # but has been seen close to 50, so leave plenty of headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build & capture screenshots
        run: bash scripts/screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/screenshots
            docs/raw
          if-no-files-found: ignore

      - name: Commit screenshots back to the branch
        if: success() && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "Update app screenshots"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
