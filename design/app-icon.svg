<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Delicate archival cotton-paper tooth across the unified painting -->
    <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.52" numOctaves="3" seed="47" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.18  0 0 0 0 0.24  0 0 0 0.048 0" in="noise" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blushBlur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="padShadowBlur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="mistBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- Sunlit turquoise-to-ivory morning gouache sky -->
    <linearGradient id="skyGrad" x1="0.1" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#3E9EC0"/>
      <stop offset="42%" stop-color="#7BCBE0"/>
      <stop offset="76%" stop-color="#CCEBE9"/>
      <stop offset="100%" stop-color="#FCF0D4"/>
    </linearGradient>

    <!-- Warm golden morning sun halo framing Dewy's silhouette -->
    <radialGradient id="sunHalo" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#FFFBE8" stop-opacity="0.96"/>
      <stop offset="46%" stop-color="#FDECC6" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#FDECC6" stop-opacity="0"/>
    </radialGradient>

    <!-- Layered coastal pond water -->
    <linearGradient id="pondGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60C2DB"/>
      <stop offset="36%" stop-color="#2D90B5"/>
      <stop offset="100%" stop-color="#144F73"/>
    </linearGradient>

    <!-- Painterly cloud wash -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="72%" stop-color="#F4F2EC"/>
      <stop offset="100%" stop-color="#C8DFE8"/>
    </linearGradient>

    <!-- Botanical emerald lily pad -->
    <radialGradient id="padGrad" cx="34%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#A5DC90"/>
      <stop offset="52%" stop-color="#58A469"/>
      <stop offset="100%" stop-color="#2B6547"/>
    </radialGradient>

    <!-- Luminous translucent porcelain-glass Dewy vessel -->
    <radialGradient id="dewyPorcelain" cx="36%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FAFFFE"/>
      <stop offset="50%" stop-color="#CAF2F1"/>
      <stop offset="86%" stop-color="#85D5E2"/>
      <stop offset="100%" stop-color="#54B2CC"/>
    </radialGradient>

    <!-- Aquamarine-to-deep-cerulean spring water inside Dewy -->
    <linearGradient id="springUpper" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#88E4EC"/>
      <stop offset="48%" stop-color="#40B4D8"/>
      <stop offset="100%" stop-color="#1E7BA6"/>
    </linearGradient>
    <linearGradient id="springDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D95BE"/>
      <stop offset="100%" stop-color="#155D86"/>
    </linearGradient>
    <linearGradient id="sunriseRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE6C2" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFD0AE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF3D6" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Iconic sculptural Dewy droplet silhouette (~66% of frame, clean zero-clutter contour) -->
    <clipPath id="dewyClip">
      <path id="dewySilhouette"
        d="M466 238
           C478 166 530 120 588 128
           C566 158 548 196 558 240
           C614 318 716 384 748 486
           C790 590 782 706 720 774
           C666 832 594 854 512 854
           C430 854 358 832 304 774
           C242 706 234 590 276 486
           C308 384 410 318 466 238 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#paperGrain)">
    <!-- 1. Layered Sunlit Gouache Lagoon Sky -->
    <rect x="0" y="0" width="1024" height="632" fill="url(#skyGrad)"/>

    <!-- Radiant sunlit morning halo behind Dewy -->
    <circle cx="512" cy="472" r="440" fill="url(#sunHalo)"/>

    <!-- Soft painterly gouache cloud banks (organic, layered, tinted undersides) -->
    <g opacity="0.88">
      <path d="M-30 256 C-12 204 42 182 88 196 C112 152 178 148 214 186 C252 176 292 204 282 240 C306 248 300 272 266 274 L-30 274 Z" fill="url(#cloudGrad)"/>
      <path d="M742 238 C754 198 800 176 842 192 C868 152 938 148 972 184 C1012 176 1050 202 1054 248 L742 248 Z" fill="url(#cloudGrad)"/>
      <ellipse cx="144" cy="272" rx="140" ry="20" fill="#B5D8E5" opacity="0.34" filter="url(#mistBlur)"/>
      <ellipse cx="902" cy="248" rx="140" ry="18" fill="#B5D8E5" opacity="0.32" filter="url(#mistBlur)"/>
    </g>

    <!-- Atmospheric sea-glass distant coastal hills (3 paper-cut depth tiers) -->
    <path d="M-24 600 C96 472 244 454 398 524 C520 580 658 498 806 476 C904 462 982 496 1048 548 L1048 632 L-24 632 Z" fill="#9AC9BE" opacity="0.62"/>
    <path d="M-24 606 C116 516 254 514 392 566 C532 618 708 512 874 520 C948 524 1004 548 1048 576 L1048 632 L-24 632 Z" fill="#6AA898" opacity="0.72"/>
    <path d="M-24 614 C108 566 216 574 334 606 C496 648 730 562 908 570 C972 574 1018 590 1048 604 L1048 636 L-24 636 Z" fill="#4B8B7F" opacity="0.65"/>

    <!-- Warm horizon mist veil blending hills into pond -->
    <rect x="0" y="572" width="1024" height="58" fill="#FFF4D8" opacity="0.28" filter="url(#mistBlur)"/>

    <!-- 2. Tranquil Sunlit Lagoon Pond -->
    <rect x="0" y="600" width="1024" height="424" fill="url(#pondGrad)"/>

    <!-- Soft painted sunlit shimmer reflecting across pond surface -->
    <ellipse cx="512" cy="616" rx="460" ry="34" fill="#E6F8FA" opacity="0.34" filter="url(#mistBlur)"/>

    <!-- Graceful organic concentric water ripple arcs radiating around lily pad -->
    <g fill="none" stroke-linecap="round">
      <path d="M126 802 C176 728 326 686 512 686 C698 686 848 728 898 802" stroke="#D8F5FA" stroke-width="4.5" opacity="0.32"/>
      <path d="M96 868 C142 948 312 992 512 992 C712 992 882 948 928 868" stroke="#A6E4F2" stroke-width="5.5" opacity="0.34"/>
      <path d="M148 874 C214 934 352 968 512 968 C672 968 810 934 876 874" stroke="#FFFDF6" stroke-width="4.2" opacity="0.44"/>
      <!-- Soft drifting sunlit reflection curls in foreground water -->
      <path d="M104 714 Q168 706 232 714" stroke="#E4F7FA" stroke-width="5" opacity="0.36"/>
      <path d="M790 704 Q858 696 926 706" stroke="#E4F7FA" stroke-width="5" opacity="0.36"/>
      <path d="M72 936 Q134 944 196 934" stroke="#9EE0EE" stroke-width="4.5" opacity="0.32"/>
      <path d="M824 944 Q888 952 952 942" stroke="#9EE0EE" stroke-width="4.5" opacity="0.32"/>
    </g>

    <!-- 3. Veined Botanical Emerald Lily Pad & Sculpted Multi-Petal Lotus -->
    <ellipse cx="512" cy="864" rx="348" ry="104" fill="#0E3D58" opacity="0.38" filter="url(#padShadowBlur)"/>

    <!-- Lily pad silhouette with delicate tinted forest-ink edge (NO thick black marker!) -->
    <path d="M512 736
             C676 736 812 770 848 820
             L722 835
             L852 854
             C822 912 680 948 512 948
             C318 948 164 900 164 842
             C164 784 318 736 512 736 Z"
          fill="url(#padGrad)" stroke="#1E523D" stroke-opacity="0.58" stroke-width="5" stroke-linejoin="round"/>

    <!-- Sunlit gouache highlight rim along left lily pad lip -->
    <path d="M180 832 C192 786 312 748 486 744" fill="none" stroke="#D2F0BA" stroke-width="7" stroke-linecap="round" opacity="0.55"/>

    <!-- Organic curving botanical veins branching softly across pad -->
    <g fill="none" stroke="#C5ECAC" stroke-width="4.5" stroke-linecap="round" opacity="0.54">
      <path d="M506 838 C422 812 320 796 226 814"/>
      <path d="M358 808 C326 792 298 784 274 784"/>
      <path d="M506 838 C406 846 314 862 246 888"/>
      <path d="M506 838 C446 878 398 906 364 928"/>
      <path d="M516 838 C568 880 618 908 656 926"/>
      <path d="M518 838 C606 804 686 784 762 778"/>
    </g>

    <!-- Sculpted multi-petal storybook pink-and-cream lotus blossom by the notch -->
    <g transform="translate(766 786)">
      <!-- Soft cast shadow onto pad -->
      <ellipse cx="0" cy="22" rx="54" ry="14" fill="#1E523D" opacity="0.28"/>
      <!-- Outer wide rose lotus petals -->
      <path d="M-54 14 C-56 -8 -32 -24 -8 -10 C-12 6 -28 20 -54 14 Z" fill="#E88AA8" stroke="#6E334E" stroke-opacity="0.48" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M54 14 C56 -8 32 -24 8 -10 C12 6 28 20 54 14 Z" fill="#E07C9C" stroke="#6E334E" stroke-opacity="0.48" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- Mid layered blush-pink cupped petals -->
      <path d="M-38 20 C-46 -12 -24 -36 -4 -22 C-2 -4 -14 18 -38 20 Z" fill="#F8B4CA" stroke="#6E334E" stroke-opacity="0.45" stroke-width="3" stroke-linejoin="round"/>
      <path d="M38 20 C46 -12 24 -36 4 -22 C2 -4 14 18 38 20 Z" fill="#F4A4BE" stroke="#6E334E" stroke-opacity="0.45" stroke-width="3" stroke-linejoin="round"/>
      <!-- Inner upright creamy-blush crown petals -->
      <path d="M-20 22 C-26 -14 -12 -44 0 -48 C12 -44 26 -14 20 22 Q0 28 -20 22 Z" fill="#FFF6F8" stroke="#6E334E" stroke-opacity="0.45" stroke-width="3" stroke-linejoin="round"/>
      <!-- Front cradling soft pink petal & sunlit pollen heart -->
      <path d="M-30 22 C-20 4 20 4 30 22 Q0 32 -30 22 Z" fill="#FBD1DF" stroke="#6E334E" stroke-opacity="0.42" stroke-width="2.6" stroke-linejoin="round"/>
      <ellipse cx="0" cy="4" rx="10" ry="7" fill="#F5C24C"/>
      <circle cx="-4" cy="2" r="2.6" fill="#FFF4BD"/>
      <circle cx="4" cy="2" r="2.6" fill="#FFF4BD"/>
    </g>

    <!-- Soft grounded contact shadow beneath Dewy -->
    <ellipse cx="512" cy="848" rx="196" ry="38" fill="#184739" opacity="0.34" filter="url(#padShadowBlur)"/>

    <!-- Tucked little translucent porcelain feet resting warmly on the pad -->
    <g stroke="#1E5266" stroke-opacity="0.52" stroke-width="4.5">
      <ellipse cx="442" cy="836" rx="48" ry="24" fill="#98DDE8"/>
      <ellipse cx="582" cy="836" rx="48" ry="24" fill="#8CD4E2"/>
    </g>

    <!-- 4. HERO SCULPTURAL DEWY — Painterly Gouache & Porcelain Glass (ZERO cartoon outlines!) -->
    <use href="#dewySilhouette" fill="url(#dewyPorcelain)"/>

    <!-- Clipped Watercolor Spring-Water Layers Inside Dewy -->
    <g clip-path="url(#dewyClip)">
      <!-- Pale aquamarine back meniscus wave -->
      <path d="M210 598 Q362 566 512 598 T814 598 L814 880 L210 880 Z" fill="#B2F1F5" opacity="0.72"/>

      <!-- Main luminous aquamarine-to-cerulean spring water layer -->
      <path d="M210 612 Q362 644 512 612 T814 612 L814 880 L210 880 Z" fill="url(#springUpper)"/>

      <!-- Whisper of warm sunlit coral-apricot sunrise shimmer along the liquid crest -->
      <path d="M210 612 Q362 644 512 612 T814 612" fill="none" stroke="url(#sunriseRim)" stroke-width="18" stroke-linecap="round"/>
      <path d="M210 607 Q362 639 512 607 T814 607" fill="none" stroke="#FFFDF8" stroke-width="7" stroke-linecap="round" opacity="0.92"/>

      <!-- Deep coastal cerulean foundation layer -->
      <path d="M210 726 Q362 752 512 726 T814 726 L814 880 L210 880 Z" fill="url(#springDeep)"/>
      <path d="M210 726 Q362 752 512 726 T814 726" fill="none" stroke="#BCEFF7" stroke-width="9" stroke-linecap="round" opacity="0.68"/>

      <!-- Internal optical caustic light ribbons -->
      <path d="M352 776 Q468 748 584 776" fill="none" stroke="#FFFDF8" stroke-width="9" stroke-linecap="round" opacity="0.38"/>
      <path d="M460 814 Q558 834 654 808" fill="none" stroke="#FFFDF8" stroke-width="7.5" stroke-linecap="round" opacity="0.32"/>

      <!-- Delicate translucent pearl bubbles drifting up -->
      <g fill="#FFFDF8" fill-opacity="0.34" stroke="#FFFDF8" stroke-width="4.5">
        <circle cx="384" cy="722" r="15"/>
        <circle cx="634" cy="698" r="12"/>
        <circle cx="576" cy="778" r="9.5"/>
        <circle cx="448" cy="784" r="8.5"/>
      </g>

      <!-- Warm golden-ivory under-belly bounce light -->
      <ellipse cx="512" cy="838" rx="188" ry="56" fill="#FFF4DA" opacity="0.48" filter="url(#softGlow)"/>

      <!-- Painterly inner watercolor shadow pooling along right & lower vessel wall -->
      <use href="#dewySilhouette" fill="none" stroke="#1C6C8C" stroke-width="42" opacity="0.34" filter="url(#softGlow)"/>
    </g>

    <!-- Painterly Gouache Porcelain Highlights & Rim Caustics -->
    <path d="M332 528 C338 438 386 358 456 306" fill="none" stroke="#FFFDF8" stroke-width="28" stroke-linecap="round" opacity="0.92"/>
    <circle cx="318" cy="580" r="14" fill="#FFFDF8" opacity="0.9"/>
    <path d="M506 202 Q526 158 564 146" fill="none" stroke="#FFFDF8" stroke-width="13" stroke-linecap="round" opacity="0.88"/>
    <path d="M708 468 C754 554 752 672 704 740" fill="none" stroke="#FFFDF8" stroke-width="12" stroke-linecap="round" opacity="0.56"/>

    <!-- Whisper-fine tinted cerulean-plum painterly contour (replaces heavy 15px cartoon marker!) -->
    <use href="#dewySilhouette" fill="none" stroke="#1D4B63" stroke-opacity="0.62" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 5. Soulful Storybook Face (Crisp from 29pt Spotlight to 1024px App Store) -->
    <!-- Soft chalky gouache coral-peach cheek washes -->
    <g filter="url(#blushBlur)">
      <ellipse cx="364" cy="614" rx="52" ry="30" fill="#F08096" opacity="0.58"/>
      <ellipse cx="660" cy="614" rx="52" ry="30" fill="#F08096" opacity="0.58"/>
    </g>

    <!-- Delicate storybook eyebrows -->
    <path d="M396 480 Q430 462 464 476" fill="none" stroke="#251E2B" stroke-width="8.5" stroke-linecap="round" opacity="0.66"/>
    <path d="M628 480 Q594 462 560 476" fill="none" stroke="#251E2B" stroke-width="8.5" stroke-linecap="round" opacity="0.66"/>

    <!-- Warm botanical plum-ink storybook eyes with single quiet organic catchlight -->
    <g>
      <ellipse cx="430" cy="544" rx="35" ry="42" fill="#251E2B"/>
      <ellipse cx="432" cy="571" rx="22" ry="11" fill="#5A4B72" opacity="0.48"/>
      <ellipse cx="418" cy="527" rx="11.5" ry="10.5" fill="#FFFDF8" opacity="0.96"/>

      <ellipse cx="594" cy="544" rx="35" ry="42" fill="#251E2B"/>
      <ellipse cx="596" cy="571" rx="22" ry="11" fill="#5A4B72" opacity="0.48"/>
      <ellipse cx="582" cy="527" rx="11.5" ry="10.5" fill="#FFFDF8" opacity="0.96"/>
    </g>

    <!-- Warm joyful open storybook smile -->
    <path d="M477 600 Q512 594 547 600 Q545 650 512 650 Q479 650 477 600 Z" fill="#5E2740" stroke="#251E2B" stroke-opacity="0.86" stroke-width="5.5" stroke-linejoin="round"/>
    <ellipse cx="512" cy="637" rx="23" ry="10" fill="#F2889E"/>
  </g>
</svg>