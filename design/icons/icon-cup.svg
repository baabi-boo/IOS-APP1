<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="120" height="120" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" seed="31" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.05 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="cupFill" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#FFFDF8"/>
    <stop offset="56%" stop-color="#E2F2F5"/>
    <stop offset="100%" stop-color="#A8D7E4"/>
  </linearGradient>
</defs>
<g filter="url(#paperGrain)">
  <!-- Delicate rising aqua steam curls matching StorybookGlyphCanvas -->
  <path d="M44 35 Q39 24 46 15" fill="none" stroke="#4CA8C8" stroke-width="3.8" stroke-linecap="round" opacity="0.88"/>
  <path d="M62 34 Q57 22 65 13" fill="none" stroke="#4CA8C8" stroke-width="3.8" stroke-linecap="round" opacity="0.88"/>
  <!-- Saucer beneath cup -->
  <ellipse cx="54" cy="96" rx="38" ry="10.5" fill="#F5EDE0" stroke="#342638" stroke-opacity="0.86" stroke-width="3.4"/>
  <ellipse cx="54" cy="95" rx="26" ry="5.5" fill="#E3D7C4"/>
  <!-- Curved ceramic ear handle -->
  <path d="M84 52 C104 52 104 80 82 82" fill="none" stroke="#342638" stroke-opacity="0.86" stroke-width="10.5" stroke-linecap="round"/>
  <path d="M84 52 C104 52 104 80 82 82" fill="none" stroke="#E4F2F5" stroke-width="4.4" stroke-linecap="round"/>
  <!-- Warm porcelain-stoneware teacup body -->
  <path d="M22 44 L86 44 L83 74 C81 88 69 96 54 96 C39 96 27 88 25 74 Z" fill="url(#cupFill)" stroke="#342638" stroke-opacity="0.86" stroke-width="3.6" stroke-linejoin="round"/>
  <ellipse cx="54" cy="44" rx="32" ry="8.5" fill="#FFFDF8" stroke="#342638" stroke-opacity="0.86" stroke-width="3.4"/>
  <ellipse cx="54" cy="45" rx="25" ry="5.5" fill="#6EC2DB"/>
  <!-- Painterly ceramic highlight -->
  <path d="M31 56 C31 68 34 78 40 84" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
</g>
</svg>
