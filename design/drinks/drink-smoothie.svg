<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="11" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.065 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="berrySmooth" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0%" stop-color="#FBB6CE"/>
    <stop offset="52%" stop-color="#EB7FA5"/>
    <stop offset="100%" stop-color="#C84E7C"/>
  </linearGradient>
  <clipPath id="smStrawClip">
    <rect x="88" y="20" width="13" height="90" rx="5" transform="rotate(-14 95 65)"/>
  </clipPath>
</defs>
<g filter="url(#paperGrain)">
  <ellipse cx="120" cy="212" rx="58" ry="11" fill="#3B2B23" opacity="0.14"/>
  <!-- Sage-striped paper straw -->
  <g>
    <rect x="88" y="20" width="13" height="88" rx="5" transform="rotate(-14 95 65)" fill="#FFF9F0" stroke="#342638" stroke-opacity="0.78" stroke-width="2.59"/>
    <g clip-path="url(#smStrawClip)" stroke="#5FA374" stroke-width="4.32">
      <line x1="70" y1="30" x2="115" y2="48"/>
      <line x1="74" y1="48" x2="119" y2="66"/>
      <line x1="78" y1="66" x2="123" y2="84"/>
    </g>
    <rect x="88" y="20" width="13" height="88" rx="5" transform="rotate(-14 95 65)" fill="none" stroke="#342638" stroke-opacity="0.78" stroke-width="2.59"/>
  </g>
  <!-- Mason jar handle on right -->
  <path d="M168 110 C196 110 198 168 168 172" fill="none" stroke="#342638" stroke-opacity="0.78" stroke-width="13" stroke-linecap="round"/>
  <path d="M168 110 C196 110 198 168 168 172" fill="none" stroke="#E9F2F5" stroke-width="3.96" stroke-linecap="round"/>
  <!-- Plump mason jar body -->
  <path d="M80 74 L160 74 L160 88 C172 96 174 114 174 134 L170 190 C169 205 71 205 70 190 L66 134 C66 114 68 96 80 88 Z" fill="#F8ECEF" fill-opacity="0.7"/>
  <!-- Thick berry smoothie fill + cream swirl -->
  <path d="M82 90 L158 90 C168 98 170 116 170 134 L166 188 C165 201 75 201 74 188 L70 134 C70 116 72 98 82 90 Z" fill="url(#berrySmooth)"/>
  <path d="M74 132 Q105 148 134 134 Q152 126 168 136" fill="none" stroke="#FFE9F0" stroke-width="5.04" stroke-linecap="round" opacity="0.58"/>
  <path d="M76 164 Q112 152 164 166" fill="none" stroke="#FFF2F6" stroke-width="3.6" stroke-linecap="round" opacity="0.45"/>
  <!-- Whipped berry cream crest -->
  <path d="M82 88 C86 72 104 68 116 74 C126 64 148 70 156 88 Z" fill="#FFF7F2" stroke="#342638" stroke-opacity="0.78" stroke-width="2.59" stroke-linejoin="round"/>
  <!-- Plump strawberry perched on right lip -->
  <path d="M148 64 C162 62 174 74 168 90 C162 102 150 104 144 96 C138 86 138 68 148 64 Z" fill="#E35362" stroke="#342638" stroke-opacity="0.78" stroke-width="2.59"/>
  <g fill="#FFE9B3">
    <circle cx="151" cy="78" r="1.8"/><circle cx="160" cy="80" r="1.8"/>
    <circle cx="155" cy="88" r="1.8"/><circle cx="148" cy="89" r="1.6"/>
  </g>
  <path d="M144 65 L154 68 L166 62 L156 56 L148 60 Z" fill="#5CA365" stroke="#342638" stroke-opacity="0.78" stroke-width="1.87" stroke-linejoin="round"/>
  <!-- Jar collar thread lines & gloss -->
  <path d="M78 114 L81 182" stroke="#FFFDF8" stroke-width="4.68" stroke-linecap="round" opacity="0.78"/>
  <path d="M80 74 L160 74 L160 88 C172 96 174 114 174 134 L170 190 C169 205 71 205 70 190 L66 134 C66 114 68 96 80 88 Z" fill="none" stroke="#342638" stroke-opacity="0.78" stroke-width="3.02" stroke-linejoin="round"/>
  <line x1="78" y1="81" x2="162" y2="81" stroke="#342638" stroke-opacity="0.78" stroke-width="1.87" stroke-opacity="0.5"/>
</g>
</svg>
