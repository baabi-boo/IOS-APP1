<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="11" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.065 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="mugClay" x1="0" y1="0" x2="1" y2="0.85">
    <stop offset="0%" stop-color="#F2DAC2"/>
    <stop offset="55%" stop-color="#D7A782"/>
    <stop offset="100%" stop-color="#A8704B"/>
  </linearGradient>
  <clipPath id="mugBodyClip"><path d="M56 88 C54 148 60 198 112 200 C164 200 170 148 168 88 Z"/></clipPath>
  <linearGradient id="latteCrema" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#B97B4F"/>
    <stop offset="100%" stop-color="#7B4828"/>
  </linearGradient>
</defs>
<g filter="url(#paperGrain)">
  <ellipse cx="114" cy="208" rx="64" ry="12" fill="#3B2B23" opacity="0.15"/>
  <!-- Aromatic coffee steam curls -->
  <path d="M96 68 C88 50 108 42 98 26" fill="none" stroke="#CBBBAE" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>
  <path d="M128 65 C120 46 140 38 130 22" fill="none" stroke="#CBBBAE" stroke-width="3.24" stroke-linecap="round" opacity="0.7"/>
  <!-- Sturdy mug ear handle -->
  <path d="M164 108 C202 106 204 166 160 168" fill="none" stroke="#342638" stroke-opacity="0.78" stroke-width="16" stroke-linecap="round"/>
  <path d="M164 108 C202 106 204 166 160 168" fill="none" stroke="#DFB18D" stroke-width="5.76" stroke-linecap="round"/>
  <!-- Plump stoneware mug body -->
  <path d="M56 88 C54 148 60 198 112 200 C164 200 170 148 168 88 Z" fill="url(#mugClay)" stroke="#342638" stroke-opacity="0.78" stroke-width="3.02" stroke-linejoin="round"/>
  <!-- Hand-dipped raw clay bottom band clipped cleanly inside mug -->
  <g clip-path="url(#mugBodyClip)">
    <path d="M52 170 Q112 182 172 170 L172 206 L52 206 Z" fill="#EFE4D6"/>
    <path d="M52 170 Q112 182 172 170" fill="none" stroke="#342638" stroke-opacity="0.78" stroke-width="2.3"/>
  </g>
  <path d="M56 88 C54 148 60 198 112 200 C164 200 170 148 168 88 Z" fill="none" stroke="#342638" stroke-opacity="0.78" stroke-width="3.02" stroke-linejoin="round"/>
  <!-- Kiln glaze speckles -->
  <g fill="#573928" opacity="0.34">
    <circle cx="80" cy="126" r="2.2"/>
    <circle cx="94" cy="154" r="1.8"/>
    <circle cx="136" cy="138" r="2.4"/>
    <circle cx="148" cy="158" r="1.8"/>
    <circle cx="118" cy="128" r="1.7"/>
    <circle cx="122" cy="162" r="2.1"/>
  </g>
  <!-- Mug specular highlight -->
  <path d="M69 112 L71 164" stroke="#FFFDF8" stroke-width="4.68" stroke-linecap="round" opacity="0.72"/>
  <!-- Mug rim & velvety crema -->
  <ellipse cx="112" cy="88" rx="56" ry="18" fill="#FAF2E6" stroke="#342638" stroke-opacity="0.78" stroke-width="3.02"/>
  <ellipse cx="112" cy="90" rx="48" ry="13.5" fill="url(#latteCrema)"/>
  <!-- Latte-art rosetta pour -->
  <g fill="#FFF9EE" opacity="0.95">
    <path d="M112 99 C104 94 94 94 92 90 C98 88 106 90 112 94 C118 90 126 88 132 90 C130 94 120 94 112 99 Z"/>
    <path d="M112 93 C106 89 98 88 97 85 C102 83 107 85 112 89 C117 85 122 83 127 85 C126 88 118 89 112 93 Z"/>
    <circle cx="112" cy="83.5" r="4"/>
  </g>
</g>
</svg>
