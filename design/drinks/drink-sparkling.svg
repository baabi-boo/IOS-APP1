<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="11" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.055 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="sparkFill" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0%" stop-color="#C8F6F2"/>
    <stop offset="52%" stop-color="#60CDD4"/>
    <stop offset="100%" stop-color="#278FA6"/>
  </linearGradient>
  <linearGradient id="limeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#BEE884"/>
    <stop offset="100%" stop-color="#539E52"/>
  </linearGradient>
</defs>
<g filter="url(#paperGrain)">
  <ellipse cx="120" cy="212" rx="50" ry="10.5" fill="#3B2B23" opacity="0.16"/>
  <!-- Crisp lime wheel perched on right rim -->
  <circle cx="160" cy="60" r="24" fill="url(#limeGrad)" stroke="#342638" stroke-opacity="0.78" stroke-width="2.6"/>
  <circle cx="160" cy="60" r="18" fill="#F0FADF"/>
  <g fill="#95D46B">
    <path d="M160 60 L148 50 A15 15 0 0 1 160 45 Z"/>
    <path d="M160 60 L172 50 A15 15 0 0 1 175 60 Z"/>
    <path d="M160 60 L172 70 A15 15 0 0 1 160 75 Z"/>
    <path d="M160 60 L148 70 A15 15 0 0 1 145 60 Z"/>
  </g>
  <!-- Charismatic tall fluted sparkling highball glass -->
  <path d="M74 54 L84 196 C86 208 154 208 156 196 L166 54 Z" fill="#F0FAF9" fill-opacity="0.62"/>
  <!-- Sparkling aquamarine mineral water -->
  <path d="M78 78 Q120 92 162 78 L154 188 C152 198 88 198 86 188 Z" fill="url(#sparkFill)"/>
  <!-- Thick weighted crystal base -->
  <path d="M86 185 Q120 197 154 185 L156 196 C154 208 86 208 84 196 Z" fill="#E6F8FA" opacity="0.72"/>
  <!-- Frothy mineral meniscus & bubbles -->
  <ellipse cx="120" cy="78" rx="42" ry="10" fill="#EEFCFA" stroke="#FFFDF8" stroke-width="2.4"/>
  <g fill="#FFFDF8" opacity="0.9">
    <circle cx="98" cy="76" r="4.5"/><circle cx="112" cy="80" r="3.6"/>
    <circle cx="128" cy="79" r="4.8"/><circle cx="141" cy="75" r="3.8"/>
    <circle cx="104" cy="166" r="3.4"/><circle cx="101" cy="144" r="4.4"/>
    <circle cx="107" cy="120" r="3.2"/><circle cx="102" cy="98" r="4.2"/>
    <circle cx="122" cy="170" r="4.2"/><circle cx="125" cy="148" r="3.0"/>
    <circle cx="119" cy="126" r="4.8"/><circle cx="124" cy="102" r="3.6"/>
    <circle cx="138" cy="156" r="3.5"/><circle cx="135" cy="130" r="4.2"/>
    <circle cx="139" cy="106" r="3.0"/>
  </g>
  <!-- Delicate vertical glass flutes -->
  <g stroke="#245C6B" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round">
    <line x1="94" y1="96" x2="99" y2="188"/>
    <line x1="112" y1="100" x2="114" y2="192"/>
    <line x1="130" y1="100" x2="128" y2="192"/>
    <line x1="146" y1="96" x2="141" y2="188"/>
  </g>
  <!-- Effervescent pearls dancing above rim -->
  <circle cx="110" cy="36" r="4" fill="#EAFBF9" stroke="#2D7485" stroke-opacity="0.6" stroke-width="1.6"/>
  <circle cx="127" cy="27" r="3" fill="#FFFDF8" stroke="#2D7485" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="98" cy="44" r="2.6" fill="#FFFDF8" stroke="#2D7485" stroke-opacity="0.5" stroke-width="1.4"/>
  <!-- Painterly glass highlight & refined rim contour -->
  <path d="M84 70 L92 184" stroke="#FFFDF8" stroke-width="6" stroke-linecap="round" opacity="0.86"/>
  <path d="M74 54 L84 196 C86 208 154 208 156 196 L166 54" fill="none" stroke="#342638" stroke-opacity="0.78" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="120" cy="54" rx="46" ry="11.5" fill="none" stroke="#342638" stroke-opacity="0.78" stroke-width="3.0"/>
</g>
</svg>
