<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="11" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.055 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="milkFill" x1="0" y1="0" x2="1" y2="0.4">
    <stop offset="0%" stop-color="#FFFDF9"/>
    <stop offset="65%" stop-color="#F5F1FA"/>
    <stop offset="100%" stop-color="#C8BFE3"/>
  </linearGradient>
  <linearGradient id="capCoral" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FAC7B8"/>
    <stop offset="100%" stop-color="#DE7A68"/>
  </linearGradient>
</defs>
<g filter="url(#paperGrain)">
  <ellipse cx="120" cy="212" rx="54" ry="11" fill="#3B2B23" opacity="0.16"/>
