  <circle cx="120" cy="151" r="10.5" fill="none" stroke="#FFF9EC" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>
  <!-- Crisp ivory cream drop inside crest -->
  <path d="M120 142 C123 147 126 150 126 154 C126 157.5 123.3 160 120 160 C116.7 160 114 157.5 114 154 C114 150 117 147 120 142 Z" fill="#FFFDF8"/>
