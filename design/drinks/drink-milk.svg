  <path d="M143 153 Q139 146 135 148 M143 153 Q139 157 136 156" fill="none" stroke="#5A9670" stroke-width="2" stroke-linecap="round"/>
  <!-- Glass bottle reflection & refined contour -->
  <path d="M86 118 L86 186" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.86"/>
  <path d="M96 46 L144 46 L144 74 C144 90 166 100 166 126 L166 194 C166 208 74 208 74 194 L74 126 C74 100 96 90 96 74 Z" fill="none" stroke="#342638" stroke-opacity="0.86" stroke-width="3.4" stroke-linejoin="round"/>
