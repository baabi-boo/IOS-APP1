  <path d="M91 34 C91 27 149 27 149 34 L152 54 Q142 59 135 54 Q127 59 120 54 Q113 59 105 54 Q98 59 88 54 Z" fill="url(#capCoral)" stroke="#342638" stroke-opacity="0.78" stroke-width="2.8" stroke-linejoin="round"/>
