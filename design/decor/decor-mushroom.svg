<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="17" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.065 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="capRed" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#F28574"/>
    <stop offset="52%" stop-color="#D95348"/>
    <stop offset="100%" stop-color="#9E3130"/>
  </linearGradient>
  <linearGradient id="stemCream" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFBF2"/>
    <stop offset="65%" stop-color="#EFE5D5"/>
    <stop offset="100%" stop-color="#D4C5B0"/>
  </linearGradient>
</defs>
<g filter="url(#paperGrain)">
  <ellipse cx="120" cy="204" rx="78" ry="13" fill="#3B2B23" opacity="0.15"/>
  <!-- Small companion toadstool on right -->
  <g transform="translate(36 22)">
    <path d="M118 164 C118 142 122 128 130 124 L144 124 C150 132 152 148 150 166 Z" fill="url(#stemCream)" stroke="#342638" stroke-opacity="0.80" stroke-width="2.66" stroke-linejoin="round"/>
    <path d="M100 128 C104 94 124 84 140 86 C158 88 172 104 170 128 Q135 138 100 128 Z" fill="url(#capRed)" stroke="#342638" stroke-opacity="0.80" stroke-width="2.81" stroke-linejoin="round"/>
    <circle cx="122" cy="108" r="6.5" fill="#FFF8EB"/>
    <circle cx="148" cy="102" r="5.5" fill="#FFF8EB"/>
    <circle cx="154" cy="118" r="4.5" fill="#FFF8EB"/>
  </g>
  <!-- Tall primary storybook amanita mushroom -->
  <g transform="rotate(-5 104 140)">
    <!-- Tapered creamy stalk -->
    <path d="M84 188 C86 156 90 128 92 106 L122 106 C126 130 132 156 134 188 C124 196 94 196 84 188 Z" fill="url(#stemCream)" stroke="#342638" stroke-opacity="0.80" stroke-width="2.96" stroke-linejoin="round"/>
    <!-- Cream gill collar ring -->
    <path d="M88 130 Q107 139 126 130" fill="none" stroke="#C8B69F" stroke-width="2.22" stroke-linecap="round"/>
    <!-- Ribbed cream underside gills -->
    <ellipse cx="107" cy="110" rx="58" ry="17" fill="#F2E4CE" stroke="#342638" stroke-opacity="0.80" stroke-width="2.66"/>
    <g stroke="#B8A48C" stroke-width="1.4" opacity="0.65">
      <line x1="66" y1="112" x2="94" y2="112"/>
      <line x1="80" y1="120" x2="100" y2="115"/>
      <line x1="120" y1="115" x2="140" y2="120"/>
      <line x1="122" y1="112" x2="150" y2="112"/>
    </g>
    <!-- Crimson speckled cap dome -->
    <path d="M44 108 C46 54 78 36 107 36 C136 36 168 54 170 108 Q107 90 44 108 Z" fill="url(#capRed)" stroke="#342638" stroke-opacity="0.80" stroke-width="3.11" stroke-linejoin="round"/>
    <!-- Painted warm ivory amanita spots -->
    <ellipse cx="78" cy="74" rx="10" ry="8" transform="rotate(-18 78 74)" fill="#FFF8EA"/>
    <ellipse cx="112" cy="54" rx="11" ry="7.5" fill="#FFF8EA"/>
    <ellipse cx="142" cy="78" rx="9.5" ry="7.5" transform="rotate(20 142 78)" fill="#FFF8EA"/>
    <circle cx="108" cy="82" r="7" fill="#FFF8EA"/>
    <circle cx="62" cy="94" r="5.5" fill="#FFF8EA"/>
    <circle cx="154" cy="96" r="5" fill="#FFF8EA"/>
    <!-- Subtle sunlight gouache sheen -->
    <path d="M68 54 Q88 42 104 42" fill="none" stroke="#FFD6CA" stroke-width="3.33" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Velvet moss cushion base + tiny clover -->
  <path d="M48 196 C64 174 96 172 120 176 C146 172 180 174 196 196 C168 206 74 206 48 196 Z" fill="#6BAE6C" stroke="#342638" stroke-opacity="0.80" stroke-width="2.96" stroke-linejoin="round"/>
  <path d="M74 188 C86 182 106 182 118 188" fill="none" stroke="#B6E2A2" stroke-width="2.37" stroke-linecap="round" opacity="0.72"/>
  <circle cx="144" cy="180" r="5.5" fill="#9BD68B" stroke="#342638" stroke-opacity="0.80" stroke-width="1.63"/>
  <circle cx="152" cy="184" r="5" fill="#82C478" stroke="#342638" stroke-opacity="0.80" stroke-width="1.63"/>
</g>
</svg>
