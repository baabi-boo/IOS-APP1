<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="3" seed="17" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.055 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="duckBody" x1="0.18" y1="0" x2="0.82" y2="1">
    <stop offset="0%" stop-color="#FDE99E"/>
    <stop offset="54%" stop-color="#F2BF46"/>
    <stop offset="100%" stop-color="#C98622"/>
  </linearGradient>
  <linearGradient id="duckWing" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FEF0B2"/>
    <stop offset="100%" stop-color="#D89626"/>
  </linearGradient>
  <linearGradient id="bellyShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#B06E18" stop-opacity="0"/>
    <stop offset="100%" stop-color="#7A4912" stop-opacity="0.34"/>
  </linearGradient>
</defs>
<g filter="url(#paperGrain)">
  <!-- Carved vintage painted wooden pond duckling (clean transparent base for any pond phase!) -->
  <path d="M54 156 C52 130 66 114 78 106 C64 88 70 52 104 48 C134 44 152 68 146 98 C162 106 180 104 196 92 C200 120 188 158 168 176 C148 192 84 194 64 178 C56 172 54 164 54 156 Z" fill="url(#duckBody)" stroke="#342638" stroke-opacity="0.78" stroke-width="3.0" stroke-linejoin="round"/>
  <!-- Soft waterline shadow along underside belly edge (transparent outside!) -->
  <path d="M62 168 C84 188 148 188 170 172 C156 190 86 192 62 168 Z" fill="url(#bellyShade)"/>
  <!-- Carved crown feather tuft -->
  <path d="M104 48 C100 35 112 30 116 42 C122 33 130 38 124 49" fill="#F8D66C" stroke="#342638" stroke-opacity="0.78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Painted terracotta-tangerine wooden bill -->
  <path d="M74 78 C54 78 40 86 42 94 C44 102 64 104 78 98 Z" fill="#E67A45" stroke="#342638" stroke-opacity="0.78" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M46 92 Q62 95 76 92" fill="none" stroke="#6E351A" stroke-opacity="0.65" stroke-width="2" stroke-linecap="round"/>
  <!-- Scalloped carved wooden wing with subtle wood-grain brushwork -->
  <path d="M104 128 C126 116 162 120 170 142 C160 164 126 170 104 158 C96 152 96 134 104 128 Z" fill="url(#duckWing)" stroke="#342638" stroke-opacity="0.78" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M116 140 Q138 135 155 144" fill="none" stroke="#A86918" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <path d="M114 150 Q134 150 149 154" fill="none" stroke="#A86918" stroke-opacity="0.48" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Sunlit gouache sheen & rosy cheek -->
  <ellipse cx="110" cy="90" rx="9.5" ry="5.8" fill="#EC8682" opacity="0.52"/>
  <path d="M90 61 Q110 53 130 61" fill="none" stroke="#FFFDF6" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
  <circle cx="96" cy="77" r="6.4" fill="#251E2B"/>
  <circle cx="94" cy="74.6" r="2.2" fill="#FFFDF8"/>
</g>
</svg>
