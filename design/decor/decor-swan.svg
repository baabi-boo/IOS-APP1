<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="3" seed="17" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.055 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="swanPearl" x1="0.1" y1="0" x2="0.7" y2="1">
    <stop offset="0%" stop-color="#FFFDF9"/>
    <stop offset="60%" stop-color="#F2ECE4"/>
    <stop offset="100%" stop-color="#D2CAE0"/>
  </linearGradient>
  <linearGradient id="swanBelly" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8C80A6" stop-opacity="0"/>
    <stop offset="100%" stop-color="#60557A" stop-opacity="0.28"/>
  </linearGradient>
</defs>
<g filter="url(#paperGrain)">
  <!-- Rear arched carved wing -->
  <path d="M124 126 C144 96 178 92 192 108 C184 126 168 140 144 146 Z" fill="#E6DFEE" stroke="#342638" stroke-opacity="0.78" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Graceful S-necked paper-cut storybook swan (clean transparent base!) -->
  <path d="M54 156 C52 136 62 126 70 116 C62 92 64 56 84 48 C102 42 114 54 109 69 C105 81 95 75 95 92 C95 114 114 124 134 122 C164 120 190 114 204 104 C204 138 188 170 158 182 C134 190 78 190 62 174 C56 168 54 162 54 156 Z" fill="url(#swanPearl)" stroke="#342638" stroke-opacity="0.78" stroke-width="3.0" stroke-linejoin="round"/>
  <path d="M62 170 C82 186 138 186 164 176 C142 192 80 192 62 170 Z" fill="url(#swanBelly)"/>
  <!-- Sculpted layered front paper-cut feather wing -->
  <path d="M104 140 C124 112 166 106 188 124 C178 150 152 166 114 164 C102 162 98 150 104 140 Z" fill="#FFFDF9" stroke="#342638" stroke-opacity="0.78" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M120 148 C140 134 162 130 176 136" fill="none" stroke="#B6ADC8" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M116 157 C136 148 156 146 168 149" fill="none" stroke="#B6ADC8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Warm coral-marigold bill & dainty antique brass crown -->
  <path d="M66 63 C50 65 44 73 48 78 C53 82 64 79 70 73 Z" fill="#EA8846" stroke="#342638" stroke-opacity="0.78" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M78 49 L76 37 L84 43 L90 34 L94 44 L100 39 L97 49 Z" fill="#F2C24E" stroke="#342638" stroke-opacity="0.78" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M76 65 Q81 61 86 65" fill="none" stroke="#251E2B" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="86" cy="71" rx="5.5" ry="3.4" fill="#F298AD" opacity="0.56"/>
</g>
</svg>
