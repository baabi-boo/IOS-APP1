<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
<defs>
  <filter id="paperGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="240" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="3" seed="25" result="noise"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.16  0 0 0 0 0.20  0 0 0 0.06 0" in="noise" result="grain"/>
    <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
  </filter>
  <linearGradient id="brassRim" x1="0.15" y1="0" x2="0.85" y2="1">
    <stop offset="0%" stop-color="#FCE79C"/>
    <stop offset="48%" stop-color="#DDA43E"/>
    <stop offset="100%" stop-color="#9A6719"/>
  </linearGradient>
  <radialGradient id="enamelDisk" cx="40%" cy="34%" r="68%">
    <stop offset="0%" stop-color="#FDE5B0"/>
    <stop offset="56%" stop-color="#F0A868"/>
    <stop offset="100%" stop-color="#C8684B"/>
  </radialGradient>

  <clipPath id="enamelClip"><circle cx="120" cy="118" r="70"/></clipPath>
  <linearGradient id="cloisonneSheen" x1="0.2" y1="0" x2="0.6" y2="1">
    <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.40"/>
    <stop offset="55%" stop-color="#FFFDF8" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
  </linearGradient>
</defs>
